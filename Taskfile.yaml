version: "3"
set: [errexit, pipefail, nounset]
shopt: [globstar]
tasks:
  default:
    desc: 👍 Setup project
    silent: true
    run: "once"
    deps:
      - init:lefthooks
      # - init:build-tokens # BUG: fix build-token task
  init:lefthooks:
    silent: true
    internal: true
    run: "once"
    cmds:
      - lefthook install
    sources:
      - ./lefthook.yml
      - ./flake.nix
      - ./flake.lock
  init:build-tokens:
    silent: true
    internal: true
    run: "once"
    cmds:
      - npm run build-tokens
    sources:
      - ./package-lock.json
      - ./package.json
      - ./config.js
      - ./svelte.config.js
      - ./tokens/**/*
  format:
    silent: true
    desc: 📝 Format project files
    run: "once"
    cmds:
      - nix fmt
  build:storybook:
    silent: true
    desc: 🎨 Build storybook
    run: "once"
    deps:
      - init:build-tokens
    cmds:
      - npm run build-storybook
  build:
    silent: true
    desc: 🧰 Build project
    run: "once"
    deps:
      - init:build-tokens
    cmds:
      - npm run build
  check:npm:
    silent: true
    run: "once"
    internal: true
    deps:
      - init:build-tokens
    cmds:
      - npm run check
  check:test:
    desc: 🚗 Run project tests
    silent: true
    run: "once"
    deps:
      - init:build-tokens
    cmds:
      - npm run test
  check:tailwind:
    desc: 🎐 Run project tests
    silent: true
    run: "once"
    deps:
      - init:build-tokens
    cmds:
      - npm run build-tailwind
  check:
    desc: ✅ Run all project checks
    silent: true
    run: "once"
    deps:
      - check:npm
      - check:test
      - lint
      - check:tailwind
  watch:storybook:
    desc: 💻 Run storybook local server to develop components
    silent: true
    run: "once"
    cmds:
      - npm run storybook
  watch:svelte:
    desc: 🐚 Run svelte local server and tests to develop website
    silent: true
    run: "once"
    cmds:
      - npm run check:watch
